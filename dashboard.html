<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>My Bookings — DriveNow</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    /* Auth state injected by Django template */
    window.isUserAuthenticated = "{{ user.is_authenticated }}" === "True";
    window.userName = "{{ user.username }}";
  </script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand logo-text" href="index.html">
        <span class="drive">Drive</span><span class="now">Now</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="cars.html">Cars</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="price.html">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div class="d-flex gap-3 align-items-center"></div>
      </div>
    </div>
  </nav>

  <!-- DASHBOARD WRAPPER -->
  <div class="dashboard-wrapper">
    <div class="container">
      <div class="dashboard-header">
        <h1>My Bookings</h1>
        <a href="cars.html" class="search-btn text-decoration-none" style="width:auto; cursor:pointer">
          + Book Another Car
        </a>
      </div>

      <div id="bookingsList">
        <p class="text-center text-muted py-5">
          <span style="font-size:32px">⏳</span><br>Loading your bookings...
        </p>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container text-center">
      <p class="mb-0 text-muted">© 2026 DriveNow. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Load script.js BEFORE inline script so helpers (getApiUrl, escHtml) are available -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const list = document.getElementById('bookingsList');

        fetch(getApiUrl('/api/my-bookings/'), { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                if (data.bookings.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <p style="font-size:48px">🚗</p>
                            <h3>No bookings yet</h3>
                            <p class="text-muted">You haven't booked any cars yet.</p>
                            <a href="cars.html" class="search-btn text-decoration-none" style="display:inline-block;margin-top:15px">
                                Browse Cars
                            </a>
                        </div>`;
                    return;
                }

                list.innerHTML = data.bookings.map(b => `
                    <div class="booking-card">
                        <img
                            src="${b.car_image ? escHtml(b.car_image) : 'images/car-1.jpg'}"
                            alt="${escHtml(b.preferred_car)}"
                            onerror="this.src='images/car-1.jpg'"
                        >
                        <div class="booking-details">
                            <h3>${escHtml(b.preferred_car)}</h3>
                            <p><strong>Pickup:</strong> ${escHtml(b.pickup_location)}</p>
                            <p><strong>Dates:</strong> ${escHtml(b.pickup_date)} → ${escHtml(b.return_date)}
                               <em>(${b.days} day${b.days !== 1 ? 's' : ''})</em></p>
                            <p><strong>Total:</strong> Rs ${Number(b.total_price).toLocaleString()}</p>
                            <p><strong>Booked on:</strong> ${escHtml(b.created_at)}</p>
                            <div class="mt-2" style="display:flex;gap:8px;flex-wrap:wrap">
                                <span class="badge badge-${escHtml(b.status)}">${escHtml(b.status)}</span>
                                <span class="badge badge-${escHtml(b.payment_status)}">${escHtml(b.payment_status)}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

            } else if (data.status === 'error' && data.message === 'Login required.') {
                // Not logged in — redirect to home with login modal trigger
                list.innerHTML = `
                    <div class="alert alert-warning text-center">
                        Please log in to view your bookings.
                        <a href="index.html" class="alert-link ms-2">Login →</a>
                    </div>`;
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);
            } else {
                list.innerHTML = `<div class="alert alert-danger">${escHtml(data.message || 'Could not load bookings.')}</div>`;
            }
        })
        .catch(() => {
            list.innerHTML = `
                <div class="alert alert-danger">
                    Connection error. Please check that the server is running and try again.
                </div>`;
        });
    });
  </script>
</body>
</html>
